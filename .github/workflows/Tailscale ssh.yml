name: Linux SSH (Fast Tailscale Login)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssh-session:
    runs-on: ubuntu-latest
    timeout-minutes: 370
    
    steps:
      - uses: actions/checkout@v4

      - name: ⚙️ Quick SSH Setup
        run: |
          # ضبط كلمة المرور مباشرة للمستخدم runner بدون تحديث النظام كامل
          echo "runner:my@12345" | sudo chpasswd
          
          # تفعيل PasswordAuthentication في SSH
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config > /dev/null
          
          sudo systemctl restart ssh
          echo "✅ SSH is configured!"

      - name: ⬇️ Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: 🔗 Generate Auth Link & Wait
        timeout-minutes: 15
        run: |
          echo "=========================================================="
          echo "⚠️ ACTION REQUIRED: CHECK THE LOGS BELOW ⚠️"
          echo "1. Look for a URL starting with https://login.tailscale.com/..."
          echo "2. Copy and paste it into your browser to authenticate."
          echo "3. Once approved, this workflow will automatically continue."
          echo "=========================================================="
          
          # تشغيل Tailscale
          sudo tailscale up --hostname "github-ssh-manual"
          
          echo "✅ Successfully connected to Tailscale!"
          
          # استخراج الـ IP وطباعة أمر الاتصال
          TS_IP=$(tailscale ip -4)
          echo "=========================================================="
          echo "🚀 YOU CAN NOW SSH INTO THE SERVER USING THIS COMMAND:"
          echo "ssh runner@$TS_IP"
          echo "Password: my@12345"
          echo "=========================================================="

      - name: ⏳ Keep Alive (355 Minutes)
        run: |
          RUNTIME=355
          END=$((SECONDS + RUNTIME * 60))
          echo "SSH active for $RUNTIME minutes..."
          
          while [ $SECONDS -lt $END ]; do
            LEFT=$(( (END - SECONDS) / 60 ))
            echo "Alive... ($LEFT minutes remaining)"
            sleep 60
          done
